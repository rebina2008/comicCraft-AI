<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ComicCraft - Create Your Comic</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0066cc; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0052a3; }
    </style>
</head>
<body>
<div class="container">
    <h2>✏️ Create Your Comic</h2>
    <form action="/generate" method="post">
        <div class="form-group">
            <label>Story Prompt:</label>
            <textarea name="prompt" rows="3" required>A brave fox explores an enchanted forest.</textarea>
        </div>
        <div class="form-group">
            <label>Main Character Name:</label>
            <input type="text" name="character_name" value="Free" required>
        </div>
        <div class="form-group">
            <label>Setting:</label>
            <select name="setting">
                <option value="Forest">Forest</option>
                <option value="School">School</option>
                <option value="Space">Space</option>
                <option value="City">City</option>
            </select>
        </div>
        <div class="form-group">
            <label>Story Tone:</label>
            <select name="tone">
                <option value="Dramatic">Dramatic</option>
                <option value="Light-hearted">Light-hearted</option>
                <option value="Funny">Funny</option>
            </select>
        </div>
        <div class="form-group">
            <label>Art Style:</label>
            <select name="style">
                <option value="Realistic">Realistic</option>
                <option value="Anime">Anime</option>
                <option value="Comic Book">Comic Book</option>
            </select>
        </div>
        <button type="submit">Generate Comic</button>
    </form>
</div>
</body>
</html>
