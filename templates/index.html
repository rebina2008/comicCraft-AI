<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-top: 40px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .form-control, .form-select { background-color: #0f172a; color: #fff; border: 1px solid #475569; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #38bdf8; box-shadow: none; }
        .btn-custom { background-color: #38bdf8; color: #0f172a; font-weight: bold; }
        .btn-custom:hover { background-color: #0284c7; color: #fff; }
    </style>
</head>
<body>

<div class="container" style="max-width: 700px;">
    <div class="card p-4 shadow-lg">
        <h2 class="text-center mb-4 text-info">🎨 ComicCraft AI Generator</h2>
        
        <form action="/generate" method="post">
            <div class="mb-3">
                <label class="form-label font-weight-bold">Comic Title / Main Concept</label>
                <input type="text" name="prompt" class="form-control" placeholder="e.g. Cyberpunk Ninja Girl" required>
            </div>

            <!-- புது ஃபீல்டு: கதையைப் பற்றி விரிவாகக் கேட்க -->
            <div class="mb-3">
                <label class="form-label font-weight-bold">Story Details / Plot (கதை விவரங்கள்)</label>
                <textarea name="story_details" class="form-control" rows="3" placeholder="Explain the story plot, climax, or what should happen in detail..."></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Character Name</label>
                    <input type="text" name="character_name" class="form-control" placeholder="e.g. Akira">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Setting / Location</label>
                    <input type="text" name="setting" class="form-control" placeholder="e.g. Neo Tokyo">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tone</label>
                    <select name="tone" class="form-select">
                        <option value="Action-packed">Action-packed</option>
                        <option value="Dramatic">Dramatic</option>
                        <option value="Humorous">Humorous</option>
                        <option value="Mystery">Mystery</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Visual Style</label>
                    <select name="style" class="form-select">
                        <option value="Anime" selected>Anime Style</option>
                        <option value="Manga Black & White">Manga Black & White</option>
                        <option value="Comic Book">American Comic Book</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-custom w-100 mt-3 py-2 fs-5">🚀 Generate Comic</button>
        </form>
    </div>
</div>

</body>
</html>
